report_comment: >
  This report has been generated by the <a href="https://github.com/charlesfoster/h2seq/tree/dev" target="_blank">charlesfoster/h2seq</a>
  analysis pipeline.
report_section_order:
  general_stats:
    remove: true
  mosdepth-cumcoverage-dist:
    remove: true
  mosdepth-coverage-dist-cov:
    remove: true
  software_versions:
    order: -1001
  "charlesfoster-h2seq-summary":
    order: -1000
  "charlesfoster-h2seq-methods-description":
    order: -999

custom_content:
  order:
    - h2seq_run_summary
    - h2seq_read_statistics
    - h2seq_coverage_statistics
    - h2seq_variant_calling

export_plots: true

disable_version_detection: true
